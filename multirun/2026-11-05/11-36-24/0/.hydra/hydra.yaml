hydra:
  run:
    dir: res/${now:%d-%m-%H-%S-%f}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  job_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - seed=42
    - model=medium.yaml
    - model.model_type=convM
    - model.convM_head_activation=False
    - n_vars=5
    - max_lags=3
    - data.ds_name=big_base_mirror
    - data.ds_path=/home/datasets4/stein/cp_v1_data/data/deterministic_ds
    - data.batch_size=16
    - model.optimizer_lr=0.001
    - model.weight_decay=0
    - model.corr_regularization=False
    - corr_input=True
    - regression_head=False
    - model.loss_type=bce
  job:
    name: train
    chdir: true
    override_dirname: corr_input=True,data.batch_size=16,data.ds_name=big_base_mirror,data.ds_path=/home/datasets4/stein/cp_v1_data/data/deterministic_ds,max_lags=3,model.convM_head_activation=False,model.corr_regularization=False,model.loss_type=bce,model.model_type=convM,model.optimizer_lr=0.001,model.weight_decay=0,model=medium.yaml,n_vars=5,regression_head=False,seed=42
    id: '0'
    num: 0
    config_name: train.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/stein/project_repos/thesis/thesis_code/cp/CausalPretraining
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/stein/project_repos/thesis/thesis_code/cp/CausalPretraining/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/stein/project_repos/thesis/thesis_code/cp/CausalPretraining/multirun/2026-11-05/11-36-24/0
    choices:
      hparams_search: null
      model: medium.yaml
      data: base.yaml
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: disabled
      hydra/hydra_logging: disabled
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false

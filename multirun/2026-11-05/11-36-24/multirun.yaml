hydra:
  run:
    dir: res/${now:%d-%m-%H-%S-%f}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  job_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - seed=42
    - model=medium.yaml
    - model.model_type=convM
    - model.convM_head_activation=False,True
    - n_vars=5
    - max_lags=3
    - data.ds_name=big_base_mirror
    - data.ds_path=/home/datasets4/stein/cp_v1_data/data/deterministic_ds
    - data.batch_size=16
    - model.optimizer_lr=0.001
    - model.weight_decay=0
    - model.corr_regularization=False
    - corr_input=True
    - regression_head=False
    - model.loss_type=bce
  job:
    name: train
    chdir: true
    override_dirname: corr_input=True,data.batch_size=16,data.ds_name=big_base_mirror,data.ds_path=/home/datasets4/stein/cp_v1_data/data/deterministic_ds,max_lags=3,model.convM_head_activation=False,True,model.corr_regularization=False,model.loss_type=bce,model.model_type=convM,model.optimizer_lr=0.001,model.weight_decay=0,model=medium.yaml,n_vars=5,regression_head=False,seed=42
    id: ???
    num: ???
    config_name: train.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/stein/project_repos/thesis/thesis_code/cp/CausalPretraining
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/stein/project_repos/thesis/thesis_code/cp/CausalPretraining/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      hparams_search: null
      model: medium.yaml
      data: base.yaml
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: disabled
      hydra/hydra_logging: disabled
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
paths:
  log_dir: run
  checkpoint_dir: ${paths.log_dir}
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.checkpoint_dir}
  max_epochs: 1000
  accelerator: auto
  devices: auto
  precision: 16-mixed
  check_val_every_n_epoch: 2
  deterministic: true
  enable_checkpointing: true
  log_every_n_steps: 313
n_vars: 5
max_lags: 3
regression_head: false
corr_input: true
distinguish_mode: false
early_stopping:
  patience: 40
  min_delta: 0
extras:
  ignore_warnings: false
  pretty_errors: true
tensorboard:
  _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
  save_dir: ${paths.checkpoint_dir}/
  name: 'null'
  log_graph: false
  default_hp_metric: true
  prefix: ''
  version: null
seed: 42
data:
  _target_: data.generator.GeneratorDataModule
  ds_path: /home/datasets4/stein/cp_v1_data/data/deterministic_ds
  ds_name: big_base_mirror
  train_ds_name: ${data.ds_path}/${data.ds_name}/simple_train.p
  test_ds_name: ${data.ds_path}/${data.ds_name}/simple_test.p
  val_ds_name: ${data.ds_path}/${data.ds_name}/simple_val.p
  deterministic_ds: true
  batch_size: 16
  n_vars: ${n_vars}
  max_lags: ${max_lags}
  binary: true
  regression: ${regression_head}
  corr_input: ${corr_input}
  epoch_size: 5000
  link_threshold: 0.85
  param_range:
  - 0.3
  - 0.5
  restrict_links: true
  noise_var: 0.4
  time_series_n: 500
  functional_class: linear
  distinguish_mode: ${distinguish_mode}
model:
  _target_: model.model_wrapper.Architecture_PL
  model_type: convM
  d_model: 128
  n_heads: 2
  num_encoder_layers: 1
  d_ff: 128
  dropout: 0.05
  distil: true
  trans_max_ts_length: 600
  gruB_hidden_size1: 96
  gruB_hidden_size2: 128
  gruB_hidden_size3: 128
  gruB_num_layers: 1
  gruU_hidden_size1: 96
  gruU_hidden_size2: 128
  gruU_hidden_size3: 128
  gruU_num_layers: 2
  convM_dim: 128
  convM_depth: 6
  convM_hidden_size1: 128
  conv1D: true
  convM_head_activation: false
  mlp_max_ts_length: 256
  mlp_hidden_size1: 128
  mlp_hidden_size2: 128
  mlp_hidden_size3: 128
  mlp_hidden_size4: 128
  n_vars: ${n_vars}
  max_lags: ${max_lags}
  regression_head: ${regression_head}
  soft_adapt: false
  corr_input: ${corr_input}
  link_thresholds:
  - 0.25
  - 0.5
  - 0.75
  corr_regularization: false
  optimizer_lr: 0.001
  weight_decay: 0
  loss_type: bce
  val_metric: ME
  distinguish_mode: ${distinguish_mode}
  full_representation_mode: false

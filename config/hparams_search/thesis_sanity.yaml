# @package _global_
# Thesis Ch. 7.1 sanity checks: every architecture x 5 seeds x with/without correlation injection.
# Used together with +experiment=thesis_sanity_<task>, see config/experiment/.
# Hydra's basic sweeper runs the full grid (50 jobs). Fixing all three parameters on the
# command line reduces it to a single job.

defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  mode: "MULTIRUN"
  launcher:
    cpus_per_task: 2
    gpus_per_task: 1
    mem_gb: 4
    timeout_min: 7200
    partition: robolab
    name: cp_sanity
  sweeper:
    params:
      model.model_type: mlp,unidirectional,bidirectional,convM,transformer
      seed: 42,43,44,45,46
      corr_input: True,False

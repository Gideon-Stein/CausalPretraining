# @package _global_
# Thesis Ch. 7.1 CM rework (thesis_doc README E7.1.12): Joint grid for CM with the corrected head
# (model.convM_head_activation=True, see model/conv.py).
#
# Same grid as the original Joint grid (cp_1/experiment_2_grid_search_medium / _big, launched with
# slurm_exp2.yaml), restricted to CM: lr {1e-4, 1e-3} x batch {16, 64, 256} x wd {0, 0.01} x CR,
# correlation injection on, edge-count head off = 24 runs per size, seed 42. Dataset joint, 5 vars, lag 3.
# Apart from ds_path, the composed CM config equals the original runs (checked 2026-11-07; big.yaml has
# changed MLP-only keys since, which CM does not use).
#
# Launch (both sizes in one sweep, 48 jobs; blocks until they are done):
#   python train.py hparams_search=thesis_cm_joint_grid
# The size of each run is recorded in its .hydra/overrides.yaml (model=medium.yaml / big.yaml).
#
# Afterwards: select per size the lowest validation MSE and rerun it with 10 seeds (42-51).

defaults:
  - override /hydra/launcher: submitit_slurm

n_vars: 5
max_lags: 3
corr_input: True
regression_head: False

data:
  ds_path: /home/datasets4/stein/cp_v1_data/data/deterministic_ds  # = thesis/paths.yaml:data_root
  ds_name: joint

model:
  model_type: convM
  convM_head_activation: True

hydra:
  mode: "MULTIRUN"
  sweep:
    dir: /home/datasets4/stein/cp_training_runs/cp_1_thesis/cm_fixed/joint_grid/${now:%Y-%m-%d_%H-%M-%S}
  launcher:
    cpus_per_task: 8   # as the original Joint grid (the joint set is large)
    gpus_per_task: 1
    mem_gb: 24
    timeout_min: 1200
    partition: robolab
    name: cp_cm_joint
  sweeper:
    params:
      model: medium.yaml,big.yaml
      seed: 42
      model.optimizer_lr: 0.0001,0.001
      data.batch_size: 16,64,256
      model.weight_decay: 0,0.01
      model.corr_regularization: False,True

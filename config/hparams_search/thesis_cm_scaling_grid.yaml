# @package _global_
# Thesis Ch. 7.1 CM rework (thesis_doc README E7.1.12): scaling grid (fig:cp:scaling) for CM with the
# corrected head (model.convM_head_activation=True). All scaling sets draw coefficient signs at random
# (data/generate_synthetic_ds.py: mirror_range=True), so every original CM scaling cell has the head defect.
#
# Same grid as the original scaling grid (cp_1/experiment_3_scale_up, _deep): lr {1e-4, 1e-3} x
# batch {16, 64, 256} x wd {0, 0.01} x CR, correlation injection on, edge-count head off, seed 42 = 24 runs
# per (number of variables, size). CM cells of the original grid (15 variables left out, every size fails):
#   5 vars  (big_base_mirror): small, medium, big
#   7 vars  (scale_up_2):      small, medium, big, deep
#   10 vars (scale_up):        medium, big, deep, lcm (= XL)
# Launch (one sweep per line, blocks until done; 72 / 72 / 24 / 48 / 48 jobs):
#   python train.py hparams_search=thesis_cm_scaling_grid data.ds_name=big_base_mirror n_vars=5  model=small.yaml,medium.yaml,big.yaml
#   python train.py hparams_search=thesis_cm_scaling_grid data.ds_name=scale_up_2      n_vars=7  model=small.yaml,medium.yaml,big.yaml
#   python train.py hparams_search=thesis_cm_scaling_grid data.ds_name=scale_up_2      n_vars=7  model=deep.yaml hydra.launcher.mem_gb=48
#   python train.py hparams_search=thesis_cm_scaling_grid data.ds_name=scale_up        n_vars=10 model=medium.yaml,big.yaml
#   python train.py hparams_search=thesis_cm_scaling_grid data.ds_name=scale_up        n_vars=10 model=deep.yaml,lcm.yaml hydra.launcher.mem_gb=48
# The size of each run is recorded in its .hydra/overrides.yaml.
# Afterwards: per cell the lowest validation MSE, rerun with seeds 42-46 (5 reruns, as the original scaling reruns).

defaults:
  - override /hydra/launcher: submitit_slurm

max_lags: 3
corr_input: True
regression_head: False

data:
  ds_path: /home/datasets4/stein/cp_v1_data/data/deterministic_ds  # = thesis/paths.yaml:data_root

model:
  model_type: convM
  convM_head_activation: True

hydra:
  mode: "MULTIRUN"
  sweep:
    dir: /home/datasets4/stein/cp_training_runs/cp_1_thesis/cm_fixed/scaling_grid/${data.ds_name}/${now:%Y-%m-%d_%H-%M-%S}
  launcher:
    cpus_per_task: 8
    gpus_per_task: 1
    mem_gb: 24
    timeout_min: 1200
    partition: robolab
    name: cp_cm_scaling
  sweeper:
    params:
      seed: 42
      model.optimizer_lr: 0.0001,0.001
      data.batch_size: 16,64,256
      model.weight_decay: 0,0.01
      model.corr_regularization: False,True

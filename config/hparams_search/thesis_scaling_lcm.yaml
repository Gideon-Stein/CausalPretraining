# @package _global_
# Slurm sweep for the LCM-Trf reruns (experiment/thesis_scaling_lcm.yaml): one job per seed.
# Resources as in the original LCM runs (48 GB RAM); one full GPU per job (no shards).
# A seed list on the command line (seed=42,43,...) replaces the default below.

defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  mode: "MULTIRUN"
  launcher:
    cpus_per_task: 8
    gpus_per_task: 1
    mem_gb: 48
    timeout_min: 300
    partition: robolab
    name: cp_lcm
  sweeper:
    params:
      seed: 44,45,46
